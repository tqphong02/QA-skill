name: Quality skill release gates

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-automation-contracts:
    name: Web automation contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run deterministic web-automation contracts
        run: node --test dynamic-testing/web-automation/tests/*.spec.mjs

  api-postman-contracts:
    name: API and Postman contract gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: integration/postman/package-lock.json

      - name: Install deterministic test runtimes
        run: |
          python -m pip install openpyxl==3.1.5 PyYAML==6.0.3
          npm ci --prefix integration/postman

      - name: Run API and Postman unit contracts
        run: |
          python -m unittest discover -s hybrid-testing/api-contract/tests -p 'test_*.py' -v
          python -m unittest discover -s integration/postman/tests -p 'test_*.py' -v
          node scripts/core-skill-router.mjs --self-test
          python scripts/validate_cross_model.py

      - name: Run local Postman API smoke
        shell: bash
        run: |
          set -euo pipefail
          port=18770
          node integration/postman/tests/fixtures/local-api-server.mjs "$port" &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for _ in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:$port/health" >/dev/null; then
              break
            fi
            sleep 0.25
          done
          curl --fail --silent "http://127.0.0.1:$port/health" >/dev/null
          python integration/postman/scripts/runner.py api-test \
            integration/postman/tests/fixtures/api-smoke.collection.json \
            --engine newman \
            --target "http://127.0.0.1:$port" \
            --timeout 15000 \
            --timeout-request 5000 \
            --report-dir "qa-runs/integration-postman/gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

  mandatory-quality-gates:
    name: AI and data quality gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run release gates
        run: python3 scripts/run_quality_skill_gates.py
