name: UI automation

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions:
  contents: read

concurrency:
  group: qa-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  CI: 'true'
  # The quickstart copies the automation project to <repository>/qa.
  # Set this to '.' when package.json lives at the repository root.
  QA_PROJECT_DIR: qa

jobs:
  preflight:
    name: Validate QA project layout
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Check package and lockfile
        shell: bash
        run: |
          set -euo pipefail
          qa_dir="$QA_PROJECT_DIR"
          test -f "$qa_dir/package.json" || { echo "::error title=CI project missing::$qa_dir/package.json was not found"; exit 1; }
          test -f "$qa_dir/package-lock.json" || { echo "::error title=Lockfile missing::Commit $qa_dir/package-lock.json; CI uses npm ci"; exit 1; }
          test -f "$qa_dir/quality-gates.json" || { echo "::error title=Quality gate missing::$qa_dir/quality-gates.json was not found"; exit 1; }
          test -f "$qa_dir/scripts/qa.mjs" || { echo "::error title=QA runner missing::$qa_dir/scripts/qa.mjs was not found"; exit 1; }
          test -f "$qa_dir/scripts/ci-preflight.mjs" || { echo "::error title=CI preflight missing::$qa_dir/scripts/ci-preflight.mjs was not found"; exit 1; }

      - name: Check unresolved placeholders
        shell: bash
        run: |
          set -euo pipefail
          cd "$QA_PROJECT_DIR"
          node scripts/check-placeholders.mjs

  lint:
    name: Lint and typecheck
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.QA_PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: |
          cd "$QA_PROJECT_DIR"
          npm ci

      - name: Validate quality-gate configuration
        run: |
          cd "$QA_PROJECT_DIR"
          npm run quality-gate:config

      - name: Lint and typecheck
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:lint

  test-ui:
    name: UI (${{ matrix.browser }})
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [preflight, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.QA_PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: |
          cd "$QA_PROJECT_DIR"
          npm ci

      - name: Cache Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ matrix.browser }}-${{ hashFiles(format('{0}/package-lock.json', env.QA_PROJECT_DIR)) }}

      - name: Install browser
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:install:browsers -- --browser ${{ matrix.browser }} --with-deps

      - name: Validate UI CI inputs
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          TEST_ACCOUNTS_JSON: ${{ secrets.TEST_ACCOUNTS_JSON }}
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:preflight -- --surface ui --require-auth

      - name: Run UI tests
        id: tests
        continue-on-error: true
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          UI_BASE_URL: ${{ secrets.UI_BASE_URL }}
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          TEST_ACCOUNTS_JSON: ${{ secrets.TEST_ACCOUNTS_JSON }}
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:test:ui -- --project=${{ matrix.browser }}

      - name: Evaluate quality gate
        id: quality
        if: always()
        continue-on-error: true
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:quality

      - name: Validate canonical Allure result
        id: contract
        if: always()
        continue-on-error: true
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:contract -- --mode ui

      - name: Upload UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-ui-${{ matrix.browser }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ env.QA_PROJECT_DIR }}/reports/
            ${{ env.QA_PROJECT_DIR }}/evidence/
            ${{ env.QA_PROJECT_DIR }}/test-results/
            ${{ env.QA_PROJECT_DIR }}/quality-gates.json

      - name: Fail UI job on test or quality failure
        if: always() && (steps.tests.outcome == 'failure' || steps.quality.outcome == 'failure' || steps.contract.outcome == 'failure')
        run: exit 1

  test-api:
    name: API
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    needs: [preflight, lint]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.QA_PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: |
          cd "$QA_PROJECT_DIR"
          npm ci

      - name: Validate API CI inputs
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          TEST_ACCOUNTS_JSON: ${{ secrets.TEST_ACCOUNTS_JSON }}
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:preflight -- --surface api --require-auth

      - name: Run API tests
        id: tests
        continue-on-error: true
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
          TEST_USER: ${{ secrets.TEST_USER }}
          TEST_PASS: ${{ secrets.TEST_PASS }}
          TEST_ACCOUNTS_JSON: ${{ secrets.TEST_ACCOUNTS_JSON }}
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:test:api

      - name: Evaluate quality gate
        id: quality
        if: always()
        continue-on-error: true
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:quality

      - name: Validate canonical Allure result
        id: contract
        if: always()
        continue-on-error: true
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:contract -- --mode api

      - name: Upload API evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-api-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ env.QA_PROJECT_DIR }}/reports/
            ${{ env.QA_PROJECT_DIR }}/evidence/
            ${{ env.QA_PROJECT_DIR }}/test-results/
            ${{ env.QA_PROJECT_DIR }}/quality-gates.json

      - name: Fail API job on test or quality failure
        if: always() && (steps.tests.outcome == 'failure' || steps.quality.outcome == 'failure' || steps.contract.outcome == 'failure')
        run: exit 1

  report:
    name: Merge and publish Allure
    needs: [test-ui, test-api]
    if: ${{ always() && (needs.test-ui.result != 'skipped' || needs.test-api.result != 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.QA_PROJECT_DIR }}/package-lock.json

      - name: Install dependencies
        run: |
          cd "$QA_PROJECT_DIR"
          npm ci

      - name: Download test artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: qa-*
          path: ${{ env.QA_PROJECT_DIR }}/ci-artifacts
          merge-multiple: false

      - name: Merge Allure results
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:merge-allure -- --input ci-artifacts --output reports/allure-results --summary reports/allure-merge.json

      - name: Generate unified Allure report
        run: |
          cd "$QA_PROJECT_DIR"
          npm run qa:report -- --mode mixed

      - name: Upload unified report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-allure-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            ${{ env.QA_PROJECT_DIR }}/reports/
            ${{ env.QA_PROJECT_DIR }}/evidence/

  k6-load-test:
    name: k6 (manual or scheduled)
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Run k6
        uses: grafana/k6-action@v0.3.1
        with:
          filename: ${{ env.QA_PROJECT_DIR }}/tests/performance/k6-load-test.js
        env:
          BASE_URL: ${{ secrets.BASE_URL }}
          K6_CLOUD_TOKEN: ${{ secrets.K6_CLOUD_TOKEN }}
