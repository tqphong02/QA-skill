engine: auto
testType: smoke
workload:
  model: concurrent-users
  users: 1
  rampUp: 1s
  holdDuration: 30s
  rampDown: 1s
  thinkTime: 1s
thresholds:
  p95Ms: 1000
  p99Ms: 2000
  maxErrorRate: 0.01
  minRequestsPerSecond: 0
  abortOnFailure: false
safety:
  maxUsers: 100
report:
  html: true
  markdown: true
  json: true
  keepRawResult: true
